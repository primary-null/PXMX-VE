name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Obsolete 'tools' package is no longer on Google's SDK repo
          packages: platform-tools
      - name: Test and assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Name APK from tag
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "PXMX-v${VER}-debug.apk"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: PXMX-v*-debug.apk
          # Upload every asset before publication locks an immutable release.
          draft: true
          # Body is written after publish: user-visible changes only.
          generate_release_notes: false
          fail_on_unmatched_files: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
