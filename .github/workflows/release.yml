name: Release APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          # Obsolete 'tools' package is no longer on Google's SDK repo
          packages: platform-tools
      - name: Restore production signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required release signing secret: $name"
              exit 1
            fi
          done
          umask 077
          KEYSTORE="$RUNNER_TEMP/pxmx-release.p12"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          echo "RELEASE_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
      - name: Test and assemble signed release APK
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify production APK and version
        run: |
          set -euo pipefail
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK=app/build/outputs/apk/release/app-release.apk
          python3 scripts/verify_release.py "$APK" --apksigner "$TOOLS/apksigner" --aapt2 "$TOOLS/aapt2"
          VERSION="$(python3 -c 'import json; print(json.load(open("app/build/outputs/apk/release/output-metadata.json"))["elements"][0]["versionName"])')"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Release tag must match the APK version: v$VERSION"
            exit 1
          fi
          mkdir -p build/release
          cp "$APK" "build/release/PXMX-v$VERSION.apk"
          cp config/release-signing.sha256 build/release/signing-certificate.sha256
          (cd build/release && sha256sum PXMX-*.apk > SHA256SUMS)
      - name: Upload verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: build/release/
          if-no-files-found: error
          retention-days: 14
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            build/release/PXMX-*.apk
            build/release/SHA256SUMS
            build/release/signing-certificate.sha256
          # Upload every asset before publication locks an immutable release.
          draft: true
          # Existing debug installations require a deliberate migration.
          body: |
            Production APK signed with the persistent PXMX release certificate.
            Older debug APKs use a different signing certificate and cannot update in place.
            Preserve your connection information before migrating; uninstalling deletes app data.
          generate_release_notes: false
          fail_on_unmatched_files: true
      - name: Publish completed release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
      - name: Remove temporary signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/pxmx-release.p12"
