name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Obsolete 'tools' package is no longer on Google's SDK repo
          packages: platform-tools
      - name: Test and assemble debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - name: Name APK from tag
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/debug/app-debug.apk "PXMX-v${VER}-debug.apk"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: PXMX-v*-debug.apk
          # Upload every asset before publication locks an immutable release.
          draft: true
          # Body is written after publish: user-visible changes only.
          generate_release_notes: false
          fail_on_unmatched_files: true
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false
