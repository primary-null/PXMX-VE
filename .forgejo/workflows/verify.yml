name: Verify
on: [push]
jobs:
  verify:
    runs-on: native-android
    env:
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Check
        run: python3 scripts/security_check.py --all

      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2

      - name: Update Proven Green
        if: success()
        run: |
          git push --force-with-lease origin HEAD:refs/heads/proven-green
