name: Verify
on: [push]
jobs:
  verify:
    runs-on: native-android
    env:
      ANDROID_HOME: /opt/android-sdk
      JAVA_HOME: /usr/lib/jvm/java-21-openjdk-amd64
      GRADLE_USER_HOME: /root/.gradle
      GRADLE_OPTS: -Dorg.gradle.caching=true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Security Check
        run: python3 scripts/security_check.py --all

      - name: Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --max-workers=2 --build-cache

      - name: Detekt
        run: ./gradlew :app:detekt --no-daemon --max-workers=2 --build-cache

      - name: Kover XML Report
        run: ./gradlew :app:koverXmlReportDebug --no-daemon --max-workers=2 --build-cache

      - name: Lint (warn-only)
        continue-on-error: true
        run: ./gradlew :app:lintDebug --no-daemon --max-workers=2 --build-cache

      - name: Connected Android Test (conditional, warn-only)
        continue-on-error: true
        run: |
          if command -v adb >/dev/null 2>&1 && adb devices | grep -v "List of devices" | grep -q "[[:alnum:]].*[[:space:]]device"; then
            echo "Active device detected; running connectedDebugAndroidTest..."
            ./gradlew :app:connectedDebugAndroidTest --no-daemon --max-workers=2 --build-cache
          else
            echo "No active adb device found; skipping connectedDebugAndroidTest."
          fi

      - name: Update Proven Green
        if: success()
        run: |
          git push --force-with-lease origin HEAD:refs/heads/proven-green
